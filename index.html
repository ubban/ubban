<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  :root {
    --bg: #0f172a;
    --board: #1e293b;
    --snake: #22c55e;
    --snake-head: #4ade80;
    --food: #f87171;
    --text: #e2e8f0;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    gap: 12px;
    padding: 16px;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    letter-spacing: 2px;
  }
  #hud {
    display: flex;
    gap: 24px;
    font-size: 1rem;
  }
  #hud span { color: var(--accent); font-weight: 600; }
  #board {
    background: var(--board);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    padding: 16px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 1.8rem; }
  button {
    background: var(--accent);
    border: none;
    color: #0f172a;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
  }
  button:hover { filter: brightness(1.1); }
  #hint { font-size: 0.85rem; color: #94a3b8; max-width: 420px; text-align: center; }
  #touch-controls {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    margin-top: 4px;
  }
  #touch-controls button {
    padding: 0;
    font-size: 1.2rem;
  }
  .tc-up { grid-column: 2; grid-row: 1; }
  .tc-left { grid-column: 1; grid-row: 2; }
  .tc-right { grid-column: 3; grid-row: 2; }
  .tc-down { grid-column: 2; grid-row: 3; }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <p id="hint">Arrow keys / WASD to move. Space to pause. Eat the red food, avoid walls and yourself.</p>
  <div id="touch-controls">
    <button class="tc-up" data-dir="up">&#8593;</button>
    <button class="tc-left" data-dir="left">&#8592;</button>
    <button class="tc-right" data-dir="right">&#8594;</button>
    <button class="tc-down" data-dir="down">&#8595;</button>
  </div>

  <div id="overlay">
    <h2 id="overlay-title">Game Over</h2>
    <p id="overlay-score"></p>
    <button id="restart-btn">Play Again</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayScore = document.getElementById('overlay-score');
  const restartBtn = document.getElementById('restart-btn');

  const CELL = 20;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;
  const BASE_SPEED_MS = 130;

  let snake, dir, nextDir, food, score, best, gameOver, paused, loopHandle;

  best = Number(localStorage.getItem('snake-best') || 0);
  bestEl.textContent = best;

  function randCell() {
    return {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS),
    };
  }

  function placeFood() {
    let cell;
    do {
      cell = randCell();
    } while (snake.some(s => s.x === cell.x && s.y === cell.y));
    food = cell;
  }

  function reset() {
    snake = [
      { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) },
      { x: Math.floor(COLS / 2) - 1, y: Math.floor(ROWS / 2) },
      { x: Math.floor(COLS / 2) - 2, y: Math.floor(ROWS / 2) },
    ];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    gameOver = false;
    paused = false;
    scoreEl.textContent = score;
    placeFood();
    overlay.classList.remove('show');
    if (loopHandle) clearInterval(loopHandle);
    loopHandle = setInterval(tick, BASE_SPEED_MS);
  }

  function setDir(x, y) {
    // prevent reversing directly into itself
    if (snake.length > 1 && dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }

  const KEY_MAP = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };

  window.addEventListener('keydown', (e) => {
    if (e.key === ' ') {
      e.preventDefault();
      if (!gameOver) togglePause();
      return;
    }
    const m = KEY_MAP[e.key];
    if (m) {
      e.preventDefault();
      setDir(m[0], m[1]);
    }
  });

  document.getElementById('touch-controls').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-dir]');
    if (!btn) return;
    const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const [x, y] = map[btn.dataset.dir];
    setDir(x, y);
  });

  function togglePause() {
    paused = !paused;
  }

  function tick() {
    if (paused || gameOver) {
      draw();
      return;
    }
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (
      head.x < 0 || head.x >= COLS ||
      head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)
    ) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function endGame() {
    gameOver = true;
    clearInterval(loopHandle);
    if (score > best) {
      best = score;
      localStorage.setItem('snake-best', String(best));
      bestEl.textContent = best;
    }
    overlayTitle.textContent = 'Game Over';
    overlayScore.textContent = `Score: ${score}  •  Best: ${best}`;
    overlay.classList.add('show');
    draw();
  }

  function draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board');
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // food
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');
    ctx.beginPath();
    ctx.arc(
      food.x * CELL + CELL / 2,
      food.y * CELL + CELL / 2,
      CELL / 2.4,
      0, Math.PI * 2
    );
    ctx.fill();

    // snake
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0
        ? getComputedStyle(document.documentElement).getPropertyValue('--snake-head')
        : getComputedStyle(document.documentElement).getPropertyValue('--snake');
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });

    if (paused && !gameOver) {
      ctx.fillStyle = 'rgba(15,23,42,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 24px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('Paused', canvas.width / 2, canvas.height / 2);
    }
  }

  restartBtn.addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
